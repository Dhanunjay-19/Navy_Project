<div style="position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 15px; border-radius: 8px; z-index: 10; font-family: sans-serif; width: 300px;">
  
  <h3 style="margin-top: 0;">Marine Digital Twin</h3>
  
  <label style="font-weight: bold; font-size: 14px;">1. Upload Survey Data (.xyz)</label><br>
  <input type="file" (change)="onFileSelected($event)" accept=".xyz,.txt" style="margin-top: 5px; margin-bottom: 15px;">
  
  <hr>

  <label>Tide Level: {{ tide | number:'1.1-1' }}m</label>
  <input type="range" [(ngModel)]="tide" min="0.0" max="5.0" step="0.1" style="width: 100%; margin-bottom: 10px;">

  <label>Vessel Speed: {{ speed }} knots</label>
  <input type="range" [(ngModel)]="speed" min="0" max="15" step="0.5" style="width: 100%; margin-bottom: 10px;">

  <label>Safety Margin (Net UKC): {{ safetyThreshold | number:'1.1-1' }}m</label>
  <input type="range" [(ngModel)]="safetyThreshold" min="0.5" max="2.0" step="0.1" style="width: 100%;">
  
</div>

<div #rendererContainer></div>
